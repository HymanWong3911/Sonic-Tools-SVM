name: Build unsigned IPA

# 在云端 macOS runner 上编译 Sonic Tools SVM，产出「未签名」的 .ipa。
# 未签名的 ipa 不能直接装，但可以用 iPhone 上的 eSign / SideStore / AltStore
# 用你自己的 Apple ID 签名后安装 —— 这样完全不需要在 Mac 上装 Xcode。
on:
  push:
    branches: [feature/build-ready]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA on macOS runner
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain and iOS SDK
        run: |
          set -euo pipefail
          # 不用 setup-xcode 固定版本：runner 镜像只保留「默认 Xcode + 匹配的 iOS SDK」，
          # 切到旧版本会出现 "iOS xx.x Platform Not Installed"（Xcode 还在，平台被裁掉了）。
          # 工程只要求 Xcode >= 15（CLANG_CXX_LANGUAGE_STANDARD = gnu++17），用默认版本最稳。
          xcodebuild -version
          echo "--- available SDKs ---"
          xcodebuild -showsdks
          echo "--- targets & schemes ---"
          xcodebuild -list -project Subsonic.xcodeproj
          if ! xcodebuild -showsdks | grep -q "iOS"; then
            echo "::error::runner 上没有可用的 iOS SDK，无法构建 iOS app"
            exit 1
          fi

      - name: Build (signing disabled)
        run: |
          set -o pipefail
          xcodebuild \
            -project Subsonic.xcodeproj \
            -scheme "Sonic Tools" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -derivedDataPath ./build \
            build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Package into unsigned .ipa
        if: success()
        run: |
          set -euo pipefail
          WS="$GITHUB_WORKSPACE"
          # 不硬编码 .app 名（target 名 = "Sonic Tools"，但 productName 元数据是 Subsonic），
          # 直接在产物目录里找唯一的 .app，避免命名不一致导致整条流水线失败
          APP_DIR="$WS/build/Build/Products/Release-iphoneos"
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::未找到 $APP_DIR"; find "$WS/build/Build/Products" -maxdepth 2 2>/dev/null || true; exit 1
          fi
          APP="$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::$APP_DIR 下没有 .app"; ls -la "$APP_DIR"; exit 1
          fi
          echo "产物 App: $APP"
          rm -rf "$WS/build/ipa" && mkdir -p "$WS/build/ipa/Payload"
          cp -R "$APP" "$WS/build/ipa/Payload/"
          ( cd "$WS/build/ipa" && zip -qry "$WS/build/SonicTools-unsigned.ipa" Payload )
          echo "=== 产物 ==="
          ls -lh "$WS/build/SonicTools-unsigned.ipa"
          echo "=== Info.plist 摘要 ==="
          PL="$WS/build/ipa/Payload/$(basename "$APP")/Info.plist"
          for k in CFBundleIdentifier CFBundleDisplayName CFBundleShortVersionString CFBundleVersion MinimumOSVersion; do
            printf '  %-28s ' "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" "$PL" 2>/dev/null || echo "(未设置)"
          done

      - name: Publish artifacts and build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # 把编译错误同时做成 GitHub 注解（无需 admin 权限即可通过 API 读到）
          if [ -f build.log ]; then
            grep -E "(error|fatal error):" build.log | head -40 | sed 's/%/%25/g; s/\r/%0D/g' | while IFS= read -r l; do echo "::error::${l:0:1000}"; done || true
            echo "=== 编译错误（前 60 行） ==="
            grep -E "(error|fatal error):" build.log | head -60 || echo "(日志里没有匹配到 error 行)"
          else
            echo "::error::没有生成 build.log"
          fi

          # 发布到固定 tag，下载链接长期有效，方便手机直接打开
          if gh release view ci-ipa >/dev/null 2>&1; then
            gh release delete ci-ipa --yes --cleanup-tag || true
          fi
          if [ -f build/SonicTools-unsigned.ipa ]; then
            gh release create ci-ipa \
              --title "Sonic Tools SVM — unsigned IPA (CI build)" \
              --notes "自动构建产物。由 GitHub Actions macOS runner 从 \`feature/build-ready\` 分支编译，**未签名**。请用 eSign / SideStore / AltStore 以自己的 Apple ID 签名后安装。" \
              build/SonicTools-unsigned.ipa
          else
            gh release create ci-ipa \
              --title "Sonic Tools SVM — CI build log (build FAILED)" \
              --notes "本次编译失败，附上完整编译日志。请查看 build.log 附件。" \
              build.log 2>/dev/null || echo "(发布日志失败)"
          fi
          # 无论如何都把日志也挂上去
          if [ -f build.log ]; then
            gh release upload ci-ipa build.log --clobber 2>/dev/null || true
          fi
          echo "下载链接："
          echo "https://github.com/HymanWong3911/Sonic-Tools-SVM/releases/download/ci-ipa/SonicTools-unsigned.ipa"
